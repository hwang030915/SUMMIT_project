<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 찾기 | 결산체크</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <section class="login-brand" id="authBrand" aria-label="결산체크 소개"></section>

      <section class="login-form-area is-compact" aria-labelledby="pageTitle">
        <p class="login-greeting">안녕하세요,</p>
        <h1 class="login-title" id="pageTitle">비밀번호를 찾으시나요?</h1>
        <p class="login-subtitle" id="pageSubtitle">가입하신 정보를 입력하시면, 비밀번호 재설정을 위한<br />인증번호를 안내해드립니다.</p>

        <!-- 1단계: 본인 확인 -->
        <form class="login-form" id="verifyForm" novalidate>
          <div class="form-alert" id="verifyAlert" role="alert"></div>

          <div class="field">
            <label class="field-label" for="name">이름<span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon" data-icon="user"></span>
              <input class="input" type="text" id="name" placeholder="이름을 입력하세요." autocomplete="name" maxlength="20" />
            </div>
            <p class="field-error"></p>
          </div>

          <div class="field">
            <label class="field-label" for="email">이메일<span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon" data-icon="mail"></span>
              <input class="input" type="email" id="email" placeholder="가입한 이메일을 입력하세요." autocomplete="email" />
            </div>
            <p class="field-error"></p>
          </div>

          <div class="field">
            <label class="field-label" for="code">인증번호<span class="required">*</span></label>
            <div class="code-row">
              <div class="input-wrap">
                <span class="input-icon" data-icon="shield"></span>
                <input class="input" type="text" id="code" placeholder="인증번호 6자리를 입력하세요." inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
              </div>
              <button type="button" class="btn btn-outline-primary" id="sendCodeBtn">인증번호 받기</button>
            </div>
            <p class="field-hint" id="codeHint">· 입력하신 이메일로 인증번호가 발송됩니다.</p>
            <p class="field-error"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="verifyBtn">비밀번호 재설정</button>
        </form>

        <!-- 2단계: 새 비밀번호 -->
        <form class="login-form" id="resetForm" novalidate hidden>
          <div class="form-alert" id="resetAlert" role="alert"></div>

          <div class="field">
            <label class="field-label" for="newPassword">새 비밀번호<span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon" data-icon="lock"></span>
              <input class="input has-trailing" type="password" id="newPassword" placeholder="새 비밀번호를 입력하세요." autocomplete="new-password" />
              <button type="button" class="icon-btn" id="toggleNew"></button>
            </div>
            <p class="field-hint" id="passwordHint"></p>
            <p class="field-error"></p>
          </div>

          <div class="field">
            <label class="field-label" for="confirmPassword">새 비밀번호 확인<span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon" data-icon="lock"></span>
              <input class="input has-trailing" type="password" id="confirmPassword" placeholder="새 비밀번호를 다시 입력하세요." autocomplete="new-password" />
              <button type="button" class="icon-btn" id="toggleConfirm"></button>
            </div>
            <p class="field-error"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="resetBtn">비밀번호 변경</button>
        </form>

        <div class="login-divider">또는</div>

        <nav class="login-links" aria-label="계정 도움말">
          <a href="login.html">로그인으로 돌아가기</a>
          <span class="sep" aria-hidden="true"></span>
          <a href="signup.html">회원가입</a>
        </nav>
      </section>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-brand.js"></script>
  <script src="js/find-password.js"></script>
</body>
</html>
