<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 | SUMMIT</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <section class="login-brand" id="authBrand" aria-label="SUMMIT 소개"></section>

      <section class="login-form-area is-compact" aria-labelledby="pageTitle">
        <p class="login-greeting">안녕하세요,</p>
        <h1 class="login-title" id="pageTitle">SUMMIT에 회원가입하세요.</h1>
        <p class="login-subtitle">지금 가입하고 더 간편한 결산 업무를 시작하세요.</p>

        <form class="login-form" id="signupForm" novalidate>
          <div class="form-alert" id="formAlert" role="alert"></div>

          <div class="field">
            <label class="field-label" for="name">이름<span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon" data-icon="user"></span>
              <input class="input" type="text" id="name" placeholder="이름을 입력하세요." autocomplete="name" maxlength="20" />
            </div>
            <p class="field-error"></p>
          </div>

          <div class="field">
            <label class="field-label" for="email">이메일<span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon" data-icon="mail"></span>
              <input class="input" type="email" id="email" placeholder="이메일을 입력하세요." autocomplete="email" />
            </div>
            <p class="field-error"></p>
          </div>

          <div class="field">
            <label class="field-label" for="department">부서<span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon" data-icon="building"></span>
              <input class="input" type="text" id="department" placeholder="소속 부서를 입력하세요." list="departmentList" maxlength="20" autocomplete="off" />
              <datalist id="departmentList"></datalist>
            </div>
            <p class="field-error"></p>
          </div>

          <div class="field">
            <label class="field-label" for="password">비밀번호<span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon" data-icon="lock"></span>
              <input class="input has-trailing" type="password" id="password" placeholder="비밀번호를 입력하세요." autocomplete="new-password" />
              <button type="button" class="icon-btn" id="togglePassword"></button>
            </div>
            <p class="field-error"></p>
          </div>

          <div class="field">
            <label class="field-label" for="passwordConfirm">비밀번호 확인<span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon" data-icon="lock"></span>
              <input class="input has-trailing" type="password" id="passwordConfirm" placeholder="비밀번호를 다시 입력하세요." autocomplete="new-password" />
              <button type="button" class="icon-btn" id="togglePasswordConfirm"></button>
            </div>
            <p class="field-error"></p>
          </div>

          <div class="field">
            <label class="agree">
              <input type="checkbox" id="agree" />
              <span><button type="button" class="link" id="termsLink">이용약관</button> 및
                <button type="button" class="link" id="privacyLink">개인정보 수집·이용</button>에 동의합니다. (필수)</span>
            </label>
            <p class="field-error"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="signupBtn">회원가입</button>
        </form>

        <div class="login-divider">이미 계정이 있으신가요?</div>

        <nav class="login-links" aria-label="계정 도움말">
          <a href="login.html" class="link-primary">로그인</a>
        </nav>
      </section>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-brand.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
