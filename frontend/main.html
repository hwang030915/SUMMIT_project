<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결산 현황 | SUMMIT</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/chatbot.css" />
</head>
<body class="app">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="app-main">
      <header class="page-header" id="pageHeader"></header>

      <div class="dash-grid">
        <section class="filter-bar" aria-label="필터">
          <div class="filter-item">
            <label for="monthFilter">결산월</label>
            <div class="input-wrap">
              <span class="input-icon" data-icon="calendar"></span>
              <select class="input select" id="monthFilter"></select>
            </div>
          </div>
          <div class="filter-item">
            <label for="deptFilter">담당 부서</label>
            <select class="input select" id="deptFilter"></select>
          </div>
          <span class="spacer"></span>
          <a class="btn btn-primary btn-sm" href="request.html"><span data-icon="plus"></span>결산 요청 등록</a>
        </section>

        <section class="stats" id="stats" aria-label="제출 요약"></section>

        <section class="card" aria-labelledby="listTitle">
          <div class="card-header list-toolbar">
            <h2 class="card-title" id="listTitle">부서별 결산 요청 현황</h2>
            <span class="card-count" id="totalCount">총 0건</span>
            <span class="spacer"></span>
            <div class="input-wrap search-box">
              <span class="input-icon" data-icon="search"></span>
              <input class="input" type="search" id="searchInput" placeholder="자료명, 부서, 제출자, 메모 검색" aria-label="검색" />
            </div>
            <div class="input-wrap sort-box">
              <span class="input-icon" data-icon="sort"></span>
              <select class="input select" id="sortSelect" aria-label="정렬"></select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table table-dashboard">
              <thead>
                <tr>
                  <th>No.</th>
                  <th>결산월</th>
                  <th>자료명</th>
                  <th>담당 부서</th>
                  <th>제출 기한</th>
                  <th>D-day</th>
                  <th>제출 상태</th>
                  <th>제출자</th>
                  <th>요청 메모</th>
                  <th>제출 메모</th>
                  <th>작업</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <nav class="pagination" id="pagination" aria-label="페이지"></nav>
        </section>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/push.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
